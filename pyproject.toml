[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobscout"
version = "0.1.0"
description = "A scheduled job-listing scout: browser, keyword filter, LLM judge, Slack."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Pinned to a release whose bundled Chromium build is reproducible in CI.
    "playwright==1.62.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Only needed with OPENAI_API_KEY set; without it a deterministic stub judges.
openai = ["openai>=1.60"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
jobscout = "jobscout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "browser: drives a real Chromium through Playwright (slower; needs `playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["jobscout", "tests"]
